<script>
// Decrypts p.bin with the key from #k=<base64url> and replaces this page with the letter.
// No external requests; everything stays inside this IIFE (document.open keeps the same window).
(async function () {
  var body = document.body, hash = /(?:^#|&)k=([^&]*)/.exec(location.hash);
  if (!hash) { body.className = 'nokey'; return; }
  try {
    var k = hash[1];
    if (!/^[A-Za-z0-9_-]{22}$/.test(k)) throw 0;   // 16 bytes = 22 base64url chars
    var key = await crypto.subtle.importKey('raw', rawKey(k), { name: 'AES-CBC' }, false, ['decrypt']);   // throws without a secure context
    var data = null;
    for (var n = 0; n < 3 && !data; n++) {   // a slow or flaky network gets two retries
      if (n) await new Promise(function (ok) { setTimeout(ok, 1500 * n); });
      try {
        var res = await fetch('p.bin', { cache: 'no-store' });
        if (res.ok) data = new Uint8Array(await res.arrayBuffer());
      } catch (e) {}
    }
    if (!data || data.length < 32) throw 0;
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv: data.slice(0, 16) }, key, data.slice(16)));
    if (!/^﻿?\s*<!doctype html/i.test(html)) throw 0;   // a wrong key that happens to unpad cleanly
    var head = /<head(?:\s[^>]*)?>/i.exec(html) || /<!doctype[^>]*>/i.exec(html), at = head.index + head[0].length;
    html = html.slice(0, at) + '<meta name="referrer" content="no-referrer"><script>(' + locked + ')("' + k + '");<\/script>' + html.slice(at);
    document.open(); document.write(html); document.close();
  } catch (e) {
    body.className = 'badkey';
  }

  function rawKey(k) {
    var s = atob(k.replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(16);
    for (var i = 0; i < 16; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  // Serialized into the decrypted page: window.Locked = { key, fetchDecrypt(url) -> Promise<ArrayBuffer> }.
  function locked(K) {
    var cryptoKey;
    window.Locked = {
      key: K,
      fetchDecrypt: async function (url) {
        if (!cryptoKey) {
          var s = atob(K.replace(/-/g, '+').replace(/_/g, '/')), a = new Uint8Array(16);
          for (var i = 0; i < 16; i++) a[i] = s.charCodeAt(i);
          cryptoKey = crypto.subtle.importKey('raw', a, { name: 'AES-CBC' }, false, ['decrypt']);
        }
        var r = await fetch(url, { cache: 'no-cache' });
        if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
        var d = new Uint8Array(await r.arrayBuffer());
        return crypto.subtle.decrypt({ name: 'AES-CBC', iv: d.slice(0, 16) }, await cryptoKey, d.slice(16));
      }
    };
  }
})();
</script>
